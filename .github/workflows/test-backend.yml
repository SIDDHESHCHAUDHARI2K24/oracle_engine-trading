name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: mbi_user
          POSTGRES_PASSWORD: mbi_password
          POSTGRES_DB: mbi
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://mbi_user:mbi_password@localhost:5433/mbi
      JWT_SECRET: ci-test-secret-key-not-for-production
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint — ruff check
        run: uv run ruff check .

      - name: Lint — ruff format check
        run: uv run ruff format --check .

      - name: Type check — mypy
        run: uv run --with "mypy>=1.11" mypy app/ --ignore-missing-imports --no-error-summary

      - name: Migration round-trip (upgrade → downgrade → upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Seed test data
        run: |
          uv run python scripts/seed_admin.py
          uv run python scripts/seed_universes.py

      - name: Run tests
        run: uv run python -m pytest -v --tb=short
