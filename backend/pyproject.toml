[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Tutorial T1"
readme = "README.md"
authors = [
    { name = "SHADOWDRAGON2K01", email = "siddheshcoursemail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "httptools>=0.7.1",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pydantic[email]>=2",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "testcontainers>=4.14.2",
    "psycopg2-binary>=2.9.12",
    "argon2-cffi>=25.1.0",
    "python-jose[cryptography]>=3.5.0",
    "typer>=0.26.4",
    "python-multipart>=0.0.30",
    "slowapi>=0.1.9",
    "alpaca-py>=0.43.4",
    "tenacity>=9.1.4",
    "pandas>=3.0.3",
    "lxml>=6.1.1",
    "yfinance>=0.2.50",
    "fredapi>=0.5.2",
    "pandas-market-calendars>=4.4",
    "prefect>=3.0.0",
    "torch>=2.2.0",
    "joblib>=1.4.0",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"


