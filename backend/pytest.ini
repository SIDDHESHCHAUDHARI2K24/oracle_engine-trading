[pytest]
# Discover tests under the feature packages.
testpaths = app/features

# Use pytest-asyncio's automatic asyncio mode for async tests.
asyncio_mode = auto

# Custom markers.
markers =
    integration: tests that require a running full app stack (DB, server)

# Suppress known harmless third-party warnings.
filterwarnings =
    ignore::DeprecationWarning:websockets\.legacy.*
    ignore::UserWarning:lightning\.pytorch\.utilities\.parsing

