# =============================================================================
# MBI Labs Oracle Engine — Dev Docker Compose
# =============================================================================

volumes:
  mbi_minio_data:
  prefect_data:

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    volumes:
      - mbi_minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0 --port 4200
    volumes:
      - prefect_data:/root/.prefect
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_DATABASE_URL:-postgresql+asyncpg://mbi_user:mbi_password@host.docker.internal:5433/prefect}
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prefect-worker:
    image: prefecthq/prefect:3-latest
    command: prefect worker start --pool default-pool --type process
    volumes:
      - prefect_data:/root/.prefect
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
